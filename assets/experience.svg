HITECTURE</text><path d="M80 128 l6 4 l-6 4z" fill="#70A5FD"/><text x="96" y="136" font-size="13.5"><tspan fill="#c9d1d9">Built scalable Java 17 / Spring Boot services for a </tspan><tspan fill="#e6edf3" font-weight="700">multi-tenant enterprise SaaS</tspan><tspan fill="#c9d1d9"> serving </tspan><tspan fill="#e6edf3" font-weight="700">thousands of concurrent users</tspan><tspan fill="#c9d1d9">.</tspan></text><path d="M80 153 l6 4 l-6 4z" fill="#70A5FD"/><text x="96" y="161" font-size="13.5"><tspan fill="#c9d1d9">Shipped </tspan><tspan fill="#70A5FD" font-weight="700">50+ REST APIs</tspan><tspan fill="#c9d1d9"> (OpenAPI/Swagger) secured with </tspan><tspan fill="#e6edf3" font-weight="700">JWT + Keycloak RBAC</tspan><tspan fill="#c9d1d9">.</tspan></text><path d="M80 178 l6 4 l-6 4z" fill="#70A5FD"/><text x="96" y="186" font-size="13.5"><tspan fill="#c9d1d9">Improved PostgreSQL response time by </tspan><tspan fill="#70A5FD" font-weight="700">~40%</tspan><tspan fill="#c9d1d9"> through indexing, query rewrites and schema redesign.</tspan></text><path d="M80 203 l6 4 l-6 4z" fill="#70A5FD"/><text x="96" y="211" font-size="13.5"><tspan fill="#c9d1d9">Built </tspan><tspan fill="#e6edf3" font-weight="700">WebSocket</tspan><tspan fill="#c9d1d9"> real-time dashboards and collaboration with </tspan><tspan fill="#70A5FD" font-weight="700">sub-second latency</tspan><tspan fill="#c9d1d9">.</tspan></text><path d="M80 228 l6 4 l-6 4z" fill="#70A5FD"/><text x="96" y="236" font-size="13.5"><tspan fill="#c9d1d9">Designed </tspan><tspan fill="#e6edf3" font-weight="700">Kafka</tspan><tspan fill="#c9d1d9">-based event-driven microservices for async processing and fault tolerance.</tspan></text><rect x="72" y="266" width="174" height="20" rx="5" fill="#38BDAE" fill-opacity=".12" stroke="#38BDAE" stroke-opacity=".45"/><text class="mono" x="83" y="280" font-size="11" font-weight="700" fill="#38BDAE" letter-spacing=".06em">RELIABILITY &amp; DEVOPS</text><path d="M80 299 l6 4 l-6 4z" fill="#38BDAE"/><text x="96" y="307" font-size="13.5"><tspan fill="#c9d1d9">Fixed memory leaks and thread contention — </tspan><tspan fill="#38BDAE" font-weight="700">~70% less production downtime</tspan><tspan fill="#c9d1d9">.</tspan></text><path d="M80 324 l6 4 l-6 4z" fill="#38BDAE"/><text x="96" y="332" font-size="13.5"><tspan fill="#c9d1d9">Built Docker + GitHub Actions CI/CD — </tspan><tspan fill="#38BDAE" font-weight="700">~50% faster release cycles</tspan><tspan fill="#c9d1d9">.</tspan></text><path d="M80 349 l6 4 l-6 4z" fill="#38BDAE"/><text x="96" y="357" font-size="13.5"><tspan fill="#c9d1d9">Ran services on AWS (EC2, ECS, RDS, S3, SES, CloudFront, CloudWatch, Lambda) at </tspan><tspan fill="#38BDAE" font-weight="700">99.9% uptime</tspan><tspan fill="#c9d1d9">.</tspan></text><path d="M80 374 l6 4 l-6 4z" fill="#38BDAE"/><text x="96" y="382" font-size="13.5"><tspan fill="#c9d1d9">Kept </tspan><tspan fill="#38BDAE" font-weight="700">85%+ test coverage</tspan><tspan fill="#c9d1d9"> on critical modules with JUnit &amp; Mockito.</tspan></text><rect x="72" y="412" width="98" height="20" rx="5" fill="#BF91F3" fill-opacity=".12" stroke="#BF91F3" stroke-opacity=".45"/><text class="mono" x="83" y="426" font-size="11" font-weight="700" fill="#BF91F3" letter-spacing=".06em">LEADERSHIP</text><path d="M80 445 l6 4 l-6 4z" fill="#BF91F3"/><text x="96" y="453" font-size="13.5"><tspan fill="#c9d1d9">Led code reviews — </tspan><tspan fill="#BF91F3" font-weight="700">~40% fewer post-release bugs</tspan><tspan fill="#c9d1d9">.</tspan></text><path d="M80 470 l6 4 l-6 4z" fill="#BF91F3"/><text x="96" y="478" font-size="13.5"><tspan fill="#c9d1d9">Mentored </tspan><tspan fill="#BF91F3" font-weight="700">3 junior developers</tspan><tspan fill="#c9d1d9"> in Spring Boot, REST API design and testing.</tspan></text>
