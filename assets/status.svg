<svg xmlns="http://www.w3.org/2000/svg" width="900" height="44" viewBox="0 0 900 44" role="img" aria-label="Status: all systems operational">
<style>text{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace;white-space:pre}@keyframes blip{0%,100%{opacity:.55}50%{opacity:1}}.blip{animation:blip 1.4s ease-in-out infinite}
@keyframes sweep{0%{transform:translateX(-200px)}100%{transform:translateX(1100px)}}.sweep{animation:sweep 4s linear infinite}</style>
<defs><linearGradient id="sw" x1="0" x2="1"><stop offset="0" stop-color="#70A5FD" stop-opacity="0"/><stop offset=".5" stop-color="#70A5FD" stop-opacity=".9"/><stop offset="1" stop-color="#70A5FD" stop-opacity="0"/></linearGradient>
<clipPath id="c"><rect x=".5" y=".5" width="899" height="43" rx="8"/></clipPath></defs>
<g clip-path="url(#c)"><rect width="900" height="44" fill="#0d1117"/><rect class="sweep" y="42" width="200" height="2" fill="url(#sw)"/><text class="blip" x="18" y="27" font-size="12" fill="#3fb950">● all systems operational</text><text x="210.5" y="27" font-size="12" fill="#30363d">│</text><text x="226.5" y="27" font-size="12" fill="#c9d1d9">uptime 99.9%</text><text x="324.1" y="27" font-size="12" fill="#30363d">│</text><text x="340.1" y="27" font-size="12" fill="#c9d1d9">build: passing</text><text x="452.3" y="27" font-size="12" fill="#30363d">│</text><text x="468.3" y="27" font-size="12" fill="#c9d1d9">errors: 0</text><text x="544.0" y="27" font-size="12" fill="#30363d">│</text><text x="560.0" y="27" font-size="12" fill="#c9d1d9">latency: sub-second</text><text x="708.7" y="27" font-size="12" fill="#30363d">│</text><text x="724.7" y="27" font-size="12" fill="#8b949e">coffee: brewing ☕</text></g>
<rect x=".5" y=".5" width="899" height="43" rx="8" fill="none" stroke="#30363d"/>
</svg>
