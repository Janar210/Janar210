.bar{transform-box:fill-box;transform-origin:bottom}
.b1{animation:grow 2.6s ease-in-out infinite}.b2{animation:grow 2.6s ease-in-out .3s infinite}.b3{animation:grow 2.6s ease-in-out .6s infinite}
.b4{animation:grow 2.6s ease-in-out .9s infinite}.b5{animation:grow 2.6s ease-in-out 1.2s infinite}
@keyframes draw{0%{stroke-dashoffset:110}50%,100%{stroke-dashoffset:0}}.line{stroke-dasharray:110;animation:draw 4s ease-out infinite}
@keyframes ping{0%,100%{opacity:.3}50%{opacity:1}}.ping,.ledp{animation:ping 1.4s ease-in-out infinite}
@keyframes floatUp{0%{transform:translateY(0);opacity:0}20%{opacity:1}80%{opacity:1}100%{transform:translateY(-34px);opacity:0}}
.float{animation:floatUp 5s ease-in-out infinite}.f2{animation-delay:1.2s}.f3{animation-delay:2.5s}.f4{animation-delay:3.7s}
@keyframes steam{0%{transform:translateY(4px);opacity:0}40%{opacity:.8}100%{transform:translateY(-8px);opacity:0}}
.steam{animation:steam 2.2s ease-out infinite}.s2{animation-delay:1.1s}
@keyframes sway{0%,100%{transform:rotate(0)}50%{transform:rotate(-4deg)}}
.leaf{transform-box:fill-box;transform-origin:bottom right;animation:sway 3.5s ease-in-out infinite}.l2{transform-origin:bottom left;animation-delay:.8s}
@keyframes logo{0%,100%{opacity:.55}50%{opacity:1}}.logo{animation:logo 2.8s ease-in-out infinite}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
