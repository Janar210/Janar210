<svg xmlns="http://www.w3.org/2000/svg" width="900" height="64" viewBox="0 0 900 64" role="img" aria-label="Motto: Write code that scales, not just code that works." xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<style>text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif}.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace}@media (prefers-reduced-motion:reduce){*{animation:none!important}}@keyframes cover{0%{transform:translateX(0)}60%,92%{transform:translateX(428px)}100%{transform:translateX(0)}}.cover{animation:cover 7s steps(51,end) infinite}@keyframes caret{0%{transform:translateX(0)}60%,92%{transform:translateX(428px)}100%{transform:translateX(0)}}@keyframes blink{50%{opacity:0}}.caret{animation:caret 7s steps(51,end) infinite,blink .9s steps(1) infinite}</style>
<defs><pattern id="dots" width="20" height="20" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#161b22"/></pattern>
<linearGradient id="flow" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#70A5FD" stop-opacity="0"/><stop offset=".5" stop-color="#70A5FD"/><stop offset="1" stop-color="#BF91F3" stop-opacity="0"/></linearGradient>
<filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs>
<rect x=".5" y=".5" width="899" height="63" rx="12" fill="#0d1117" stroke="#30363d"/>

<text class="mono" x="236" y="38" font-size="14" fill="#c9d1d9" font-style="italic">&quot;Write code that scales, not just code that works.&quot;</text><rect class="cover" x="234" y="18" width="442" height="28" fill="#0d1117"/><rect class="caret" x="236" y="24" width="8" height="18" fill="#70A5FD"/>
</svg>