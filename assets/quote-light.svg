<svg xmlns="http://www.w3.org/2000/svg" width="900" height="64" viewBox="0 0 900 64" role="img" aria-label="Motto: Write code that scales, not just code that works.">
<style>text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif}.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace}@media (prefers-reduced-motion:reduce){*{animation:none!important}}@keyframes open{0%,1.18%{opacity:0}1.19%,92%{opacity:1}100%{opacity:0}}.open{animation:open 7s linear infinite}@keyframes typed{0%{clip-path:inset(0 100% 0 0);animation-timing-function:steps(1,end)}1.18%{clip-path:inset(0 100% 0 0);animation-timing-function:steps(49,end)}58.82%{clip-path:inset(0 0 0 0)}92%{clip-path:inset(0 0 0 0);animation-timing-function:steps(1,end)}100%{clip-path:inset(0 100% 0 0)}}.typed{animation:typed 7s infinite}@keyframes close{0%,59.99%{opacity:0}60%,92%{opacity:1}100%{opacity:0}}.close{animation:close 7s linear infinite}@keyframes caret{0%{transform:translateX(0);animation-timing-function:steps(1,end)}1.18%{transform:translateX(22px);animation-timing-function:steps(49,end)}58.82%{transform:translateX(433.6px);animation-timing-function:steps(1,end)}60%,92%{transform:translateX(454.6px);animation-timing-function:steps(1,end)}100%{transform:translateX(0)}}@keyframes blink{50%{opacity:0}}.caret{animation:caret 7s infinite,blink .9s steps(1) infinite}</style>
<defs><pattern id="dots" width="20" height="20" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#eef1f4"/></pattern>
<linearGradient id="flow" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0969da" stop-opacity="0"/><stop offset=".5" stop-color="#0969da"/><stop offset="1" stop-color="#8250df" stop-opacity="0"/></linearGradient>
<filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs>
<rect x=".5" y=".5" width="899" height="63" rx="12" fill="#ffffff" stroke="#d0d7de"/>
<rect x="1" y="1" width="898" height="62" rx="12" fill="url(#dots)"/>
<text class="open" x="236.2" y="40" text-anchor="end" font-size="22" font-weight="700" fill="#8250df">«</text><text class="mono typed" x="244.2" y="37" font-size="14" fill="#24292f" font-style="italic">Write code that scales, not just code that works.</text><text class="close" x="661.8" y="40" font-size="22" font-weight="700" fill="#8250df">»</text><rect class="caret" x="222.2" y="23" width="8" height="18" fill="#0969da"/>
</svg>
