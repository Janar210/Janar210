<svg xmlns="http://www.w3.org/2000/svg" width="900" height="397" viewBox="0 0 900 397" role="img" aria-label="Impact metrics: 99.9% uptime, 70% less downtime, 40% faster database, 50% faster releases, 85% test coverage, 50+ secure REST APIs, thousands of concurrent users, 40% fewer post-release bugs">
<style>
text{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace}
.lbl{font-size:10.5px;fill:#57606a;letter-spacing:.08em}
.big{font-size:28px;font-weight:700}
.sub{font-size:10.5px;fill:#6e7781}
@keyframes shrink{0%{transform:scaleX(1)}40%,100%{transform:scaleX(.3)}}
@keyframes shrink50{0%{transform:scaleX(1)}40%,100%{transform:scaleX(.5)}}
@keyframes draw{0%{stroke-dashoffset:var(--len)}45%,100%{stroke-dashoffset:0}}
@keyframes blip{0%,100%{opacity:.3}50%{opacity:1}}
@keyframes ecg{0%{stroke-dashoffset:600}100%{stroke-dashoffset:0}}
/* the "after" bar keeps its rounded ends while it shortens: the bar stays put and a rounded window
   over it slides left, instead of squashing the bar (which flattened its corners) */
@keyframes cut{0%{transform:translateX(0)}40%,100%{transform:translateX(-98px)}}
.bar1{animation:cut 7s cubic-bezier(.6,0,.2,1) infinite}
.bar2{transform-box:fill-box;transform-origin:left;animation:shrink50 7s cubic-bezier(.6,0,.2,1) infinite}
.spark{stroke-dasharray:var(--len);animation:draw 7s ease-out infinite}
.ecg{stroke-dasharray:140 460;animation:ecg 2.4s linear infinite}
.blip{animation:blip 1.2s ease-in-out infinite}
@keyframes mv{0%{transform:translateX(0);opacity:0}8%{opacity:1}92%{opacity:1}100%{transform:translateX(118px);opacity:0}}
.pkt{animation:mv 2.2s linear infinite}
/* REST APIs: endpoints appear one by one and each gets its lock */
.ep{opacity:0;animation:7s ease-out infinite}.ep0{animation-name:ep0}.ep1{animation-name:ep1}.ep2{animation-name:ep2}
@keyframes ep0{0%,6%{opacity:0;transform:translateX(-6px)}12%,92%{opacity:1;transform:none}100%{opacity:0}}
@keyframes ep1{0%,16%{opacity:0;transform:translateX(-6px)}22%,92%{opacity:1;transform:none}100%{opacity:0}}
@keyframes ep2{0%,26%{opacity:0;transform:translateX(-6px)}32%,92%{opacity:1;transform:none}100%{opacity:0}}
.lk{opacity:0;animation:7s steps(1,end) infinite}.lk0{animation-name:lk0}.lk1{animation-name:lk1}.lk2{animation-name:lk2}
@keyframes lk0{0%,15%{opacity:0}16%,92%{opacity:1}100%{opacity:0}}
@keyframes lk1{0%,25%{opacity:0}26%,92%{opacity:1}100%{opacity:0}}
@keyframes lk2{0%,35%{opacity:0}36%,92%{opacity:1}100%{opacity:0}}
/* concurrent users: requests flow from users through the load balancer to the ECS tasks, which fill up */
.req{offset-rotate:0deg;animation:req 1.5s linear infinite backwards}.req2{animation-duration:.9s}
@keyframes req{0%{offset-distance:0%;opacity:0}10%,90%{opacity:1}100%{offset-distance:100%;opacity:0}}
.cap{transform-box:fill-box;transform-origin:left;animation:cap 7s ease-out infinite backwards}
@keyframes cap{0%{transform:scaleX(0)}30%,90%{transform:scaleX(1)}100%{transform:scaleX(0)}}
/* post-release bugs: a review lens stops on each bug and it turns from red to green */
.lens{animation:lens 7s ease-in-out infinite}
@keyframes lens{0%{transform:translate(20px,100px)}18%,30%{transform:translate(60px,108px)}50%,62%{transform:translate(110px,120px)}100%{transform:translate(20px,100px)}}
.bug0,.bug1{animation:7s steps(1,end) infinite}.bug0{animation-name:bug0}.bug1{animation-name:bug1}
.fix0,.fix1{opacity:0;animation:7s steps(1,end) infinite}.fix0{animation-name:fix0}.fix1{animation-name:fix1}
@keyframes bug0{0%{opacity:1}26%{opacity:0}98%{opacity:1}}@keyframes fix0{0%{opacity:0}26%{opacity:1}98%{opacity:0}}
@keyframes bug1{0%{opacity:1}58%{opacity:0}98%{opacity:1}}@keyframes fix1{0%{opacity:0}58%{opacity:1}98%{opacity:0}}
/* test coverage: the tested modules light up one by one */
.mod{opacity:0;animation:mod 7s steps(1,end) infinite backwards}@keyframes mod{0%{opacity:0}1%,92%{opacity:1}100%{opacity:0}}
</style>
