e(.75)" class="fw-line"><path d="M3 12h4l3-7 4 14 3-7h4"/></g><text x="40" y="26" font-size="13" font-weight="700" fill="#e6edf3">Production Stability Fix</text><text x="16" y="66" font-size="24" font-weight="700" fill="#3fb950">−70%</text><text x="16" y="84" font-size="10.5" fill="#8b949e">downtime</text><svg x="172" y="36" width="104" height="83" viewBox="0 0 100 80" overflow="visible"><path d="M6 8V66H96" class="fw-axis"/><path d="M6 14H96" class="fw-lim"/><text x="95" y="10.5" text-anchor="end" class="fw-lbl">heap limit</text><path d="M8 60L13 49L15 57L21 42L23 52L26 46L28 50L34 30L36 41L40 32L42 36L46 15" class="fw-heap fw-leak"/><g class="fw-fix"><path d="M46 66V8" class="fw-mark"/><text x="46" y="76" text-anchor="middle" class="fw-lbl fw-lbl-fix">fix</text></g><path d="M46 58L51 47L53 59L57 50L59 56L65 42L67 58L70 51L72 60L78 45L80 57L83 49L85 55L91 43L93 59L96 54" class="fw-heap fw-gc"/><text x="22" y="76" text-anchor="middle" class="fw-lbl fw-lbl-bad">before</text><text x="74" y="76" text-anchor="middle" class="fw-lbl fw-lbl-good fw-after">after</text></svg><text x="16" y="130" font-size="9" fill="#6e7681">Java 17 · Heap &amp; thread analysis · New Relic</text><text x="16" y="148" font-size="10.5" fill="#c9d1d9">Tracked down the memory leaks behind</text><text x="16" y="162" font-size="10.5" fill="#c9d1d9">recurring outages.</text></g><g transform="translate(610,34)" style="color:#BF91F3"><rect width="290" height="176" rx="10" fill="#0d1117" stroke="#30363d"/><g transform="translate(16 13) scale(.75)" class="fw-line"><path d="M6 9a6 6 0 0 1 12 0c0 6 3 7 3 7H3s3-1 3-7M10 20a2 2 0 0 0 4 0"/></g><text x="40" y="26" font-size="13" font-weight="700" fill="#e6edf3">Real-Time Notifications</text><text x="16" y="66" font-size="24" font-weight="700" fill="#BF91F3">&lt; 1s</text><text x="16" y="84" font-size="10.5" fill="#8b949e">live updates</text><svg x="172" y="36" width="104" height="83" viewBox="0 0 100 80" overflow="visible"><rect x="4" y="28" width="24" height="24" rx="4" class="fw-line"/><path d="M9 35h14M9 40h14M9 45h9" class="fw-dash"/><path d="M28 36C44 36 50 18 64 18" class="fw-dash"/><path d="M28 44C44 44 50 62 64 62" class="fw-dash"/><circle r="2.6" class="fw-fill fw-go fw-go1"/><circle r="2.6" class="fw-fill fw-go fw-go2"/><g class="fw-bell"><path d="M72 22a6 6 0 0 1 12 0c0 6 3 7 3 7H69s3-1 3-7M76 32a2 2 0 0 0 4 0" class="fw-line"/></g><rect x="68" y="54" width="20" height="15" rx="2" class="fw-line"/><path d="M68 56l10 7 10-7" class="fw-line"/></svg><text x="16" y="130" font-size="9" fill="#6e7681">WebSocket · Spring Boot · AWS SES · SendGrid</text><text x="16" y="148" font-size="10.5" fill="#c9d1d9">Live changes and alerts reach users</text><text x="16" y="162" font-size="10.5" fill="#c9d1d9">instantly, in the app and by email.</text></g><g transform="translate(0,225)" style="color:#f0b72f"><rect width="290" height="176" rx="10" fill="#0d1117" stroke="#30363d"/><g transform="translate(16 13) scale(.75)" class="fw-line"><rect x="3" y="8" width="5" height="8" rx="1"/><rect x="10" y="8" width="5" height="8" rx="1"/><rect x="17" y="8" width="4" height="8" rx="1"/></g><text x="40" y="26" font-size="13" font-weight="700" fill="#e6edf3">CI/CD &amp; Faster Releases</text><text x="16" y="66" font-size="24" font-weight="700" fill="#f0b72f">−50%</text><text x="16" y="84" font-size="10.5" fill="#8b949e">release time</text><svg x="172" y="36" width="104" height="83" viewBox="0 0 100 80" overflow="visible"><path d="M12 34H88" class="fw-dash"/><circle cx="88" cy="34" r="6" class="fw-fill fw-ping"/><circle cx="12" cy="34" r="6" class="fw-node fw-n1"/><circle cx="37" cy="34" r="6" class="fw-node fw-n2"/><circle cx="63" cy="34" r="6" class="fw-node fw-n3"/><circle cx="88" cy="34" r="6" class="fw-node fw-n4"/><circle r="2.6" class="fw-run"/><text x="12" y="54" text-anchor="middle" class="fw-lbl">build</text><text x="37" y="54" text-anchor="middle" class="fw-lbl">test</text><text x="63" y="54" text-anchor="middle" class="fw-lbl">image</text><text x="88" y="54" text-anchor="middle" class="fw-lbl">ECS</text><rect x="12" y="62" width="76" height="4" rx="2" class="fw-ptrack"/><rect x="12" y="62" width="76" height="4" rx="2" class="fw-fill fw-pbar"/></svg><text x="16" y="130" font-size="9" fill="#6e7681">Docker · GitHub Actions · AWS ECS · JUnit 5</text><text x="16" y="148" font-size="10.5" fill="#c9d1d9">Every push built, tested and shipped</text><text x="16" y="162" font-size="10.5" fill="#c9d1d9">automatically.</text></g><g transform="translate(305,225)" style="color:#38BDAE"><rect width="290" height="176" rx="10" fill="#0d1117" stroke="#30363d"/><g transform="translate(16 13) scale(.75)" class="fw-line"><rect x="3" y="4" width="18" height="13" rx="2"/><path d="M7 11h2l1.5-3 2 6 1.5-3H17M9 21h6M12 17v4"/></g><text x="40" y="26" font-size="13" font-weight="700" fill="#e6edf3">Monitoring &amp; Observability</text><text x="16" y="66" font-size="24" font-weight="700" fill="#38BDAE">24/7</text><text x="16" y="84" font-size="10.5" fill="#8b949e">alerting</text><svg x="172" y="36" width="104" height="83" viewBox="0 0 100 80" overflow="visible"><path d="M4 64H96" class="fw-axis"/><path d="M4 22H96" class="fw-lim"/><text x="95" y="18.5" text-anchor="end" class="fw-lbl">alert</text><path d="M6 52L12 48L18 51L24 46L30 50L36 47L42 49L48 44L52 16L56 46L62 49L68 45L74 50L80 47L86 49L94 46" class="fw-heap fw-mon"/><g class="fw-alarm"><circle cx="52" cy="16" r="4.5" fill="#e5534b"/><circle cx="52" cy="16" r="4.5" class="fw-ring"/></g><g class="fw-resolved"><circle cx="52" cy="16" r="5" class="fw-fill"/><path d="M49.6 16l1.7 1.7 3.2-3.4" class="fw-okt"/></g><text x="50" y="76" text-anchor="middle" class="fw-lbl">p95 latency · live</text></svg><text x="16" y="130" font-size="9" fill="#6e7681">New Relic APM · CloudWatch · Structured logs</text><text x="16" y="148" font-size="10.5" fill="#c9d1d9">Problems are spotted and traced before</text><text x="16" y="162" font-size="10.5" fill="#c9d1d9">users feel them.</text></g><g transform="translate(610,225)" style="color:#F0883E"><rect width="290" height="176" rx="10" fill="#0d1117" stroke="#30363d"/><g transform="translate(16 13) scale(.75)" class="fw-line"><ellipse cx="12" cy="5" rx="8" ry="3"/><path d="M4 5v14c0 1.7 3.6 3 8 3s8-1.3 8-3V5M4 12c0 1.7 3.6 3 8 3s8-1.3 8-3"/></g><text x="40" y="26" font-size="13" font-weight="700" fill="#e6edf3">Database Performance</text><text x="16" y="66" font-size="24" font-weight="700" fill="#F0883E">+40%</text><text x="16" y="84" font-size="10.5" fill="#8b949e">faster queries</text><svg x="172" y="36" width="104" height="83" viewBox="0 0 100 80" overflow="visible"><g class="fw-dbi"><ellipse cx="12" cy="24" rx="8" ry="3"/><path d="M4 24v24c0 1.7 3.6 3 8 3s8-1.3 8-3V24M4 36c0 1.7 3.6 3 8 3s8-1.3 8-3"/></g><text x="28" y="21" class="fw-lbl">before</text><rect x="28" y="25" width="68" height="6" rx="3" class="fw-ptrack"/><rect x="28" y="25" width="68" height="6" rx="3" class="fw-qslow"/><text x="28" y="47" class="fw-lbl">after</text><rect x="28" y="51" width="68" height="6" rx="3" class="fw-ptrack"/><rect x="28" y="51" width="41" height="6" rx="3" class="fw-fill fw-qfast"/><text x="50" y="76" text-anchor="middle" class="fw-lbl">query time · p95</text></svg><text x="16" y="130" font-size="9" fill="#6e7681">PostgreSQL · Indexing · Query tuning</text><text x="16" y="148" font-size="10.5" fill="#c9d1d9">Kept the database fast while tenant data</text><text x="16" y="162" font-size="10.5" fill="#c9d1d9">kept growing.</text></g>
</svg>
