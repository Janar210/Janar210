<svg xmlns="http://www.w3.org/2000/svg" width="900" height="407" viewBox="0 0 900 407" role="img" aria-label="Featured work: Multi-Tenant SaaS Platform (99.9% uptime), Production Stability Fix (−70% downtime), Real-Time Notifications (&lt; 1s live updates), CI/CD &amp; Faster Releases (−50% release time), Monitoring &amp; Observability (24/7 alerting), Database Performance (+40% faster queries)">
<style>svg{--blue:#70A5FD;--green:#3fb950;--purple:#BF91F3;--line2:#30363d;--muted:#8b949e;--text:#e6edf3;--panel:#0d1117;--mono:ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace}text{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace}
.fw-line{fill:none;stroke:currentColor;stroke-width:1.8;stroke-linejoin:round;stroke-linecap:round}
.fw-fill{fill:currentColor}.fw-dash{fill:none;stroke:var(--line2);stroke-width:1.6;stroke-dasharray:3 3}
.fw-axis{fill:none;stroke:var(--line2);stroke-width:1.4}.fw-lbl{font:600 7.5px var(--mono);fill:var(--muted)}
.fw-db{fill:none;stroke-width:1.5}.fw-db0,.fw-tp0{stroke:var(--blue);fill:var(--blue)}.fw-db1,.fw-tp1{stroke:var(--green);fill:var(--green)}.fw-db2,.fw-tp2{stroke:#f0b72f;fill:#f0b72f}
.fw-db ellipse,.fw-db path{fill:none}
.fw-tp{stroke:none;opacity:0;offset-rotate:0deg;animation:fwtp 3s linear infinite}
.fw-tp0{offset-path:path("M4 40H36M52 40C62 40 64 14 74 14")}.fw-tp1{offset-path:path("M4 40H36M52 40C62 40 64 40 74 40");animation-delay:-1s}.fw-tp2{offset-path:path("M4 40H36M52 40C62 40 64 66 74 66");animation-delay:-2s}
@keyframes fwtp{0%{offset-distance:0%;opacity:0}8%{opacity:1}90%{opacity:1}100%{offset-distance:100%;opacity:0}}
.fw-lim{fill:none;stroke:#e5534b;stroke-width:1.2;stroke-dasharray:3 3;opacity:.6}
.fw-heap{fill:none;stroke-width:1.9;stroke-linejoin:round;stroke-linecap:round;stroke-dasharray:200;stroke-dashoffset:0}
.fw-leak{stroke:#e5534b;animation:fwleak 6s ease-in-out infinite}.fw-gc{stroke:currentColor;animation:fwgc 6s ease-in-out infinite}
@keyframes fwleak{0%{stroke-dashoffset:200}45%,92%{stroke-dashoffset:0}100%{stroke-dashoffset:200}}
@keyframes fwgc{0%,50%{stroke-dashoffset:200}85%,92%{stroke-dashoffset:0}100%{stroke-dashoffset:200}}
.fw-mark{stroke:var(--text);stroke-width:1;stroke-dasharray:2 2}.fw-lbl-fix{fill:var(--text)}.fw-lbl-bad{fill:#e5534b}.fw-lbl-good{fill:currentColor}
.fw-fix{animation:fwfix 6s ease-out infinite}.fw-after{animation:fwafter 6s ease-out infinite}
@keyframes fwfix{0%,42%{opacity:0}46%,92%{opacity:1}100%{opacity:0}}
@keyframes fwafter{0%,50%{opacity:0}55%,92%{opacity:1}100%{opacity:0}}
