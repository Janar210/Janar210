.fw-go1{offset-path:path("M28 36C44 36 50 18 64 18")}.fw-go2{offset-path:path("M28 44C44 44 50 62 64 62");animation-delay:.6s}
@keyframes fwgo{0%{offset-distance:0%;opacity:0}15%{opacity:1}80%{opacity:1}100%{offset-distance:100%;opacity:0}}
.fw-bell{transform-origin:78px 16px;animation:fwbell 2.2s ease-in-out infinite}
@keyframes fwbell{0%,55%,100%{transform:rotate(0)}65%{transform:rotate(14deg)}75%{transform:rotate(-12deg)}85%{transform:rotate(6deg)}}
.fw-node{fill:currentColor;stroke:currentColor;stroke-width:1.8;animation:4s steps(1,end) infinite}
.fw-n1{animation-name:fwn1}.fw-n2{animation-name:fwn2}.fw-n3{animation-name:fwn3}.fw-n4{animation-name:fwn4}
@keyframes fwn1{0%,92%{fill:currentColor}100%{fill:var(--panel)}}
@keyframes fwn2{0%,23%{fill:var(--panel)}24%,92%{fill:currentColor}100%{fill:var(--panel)}}
@keyframes fwn3{0%,46%{fill:var(--panel)}47%,92%{fill:currentColor}100%{fill:var(--panel)}}
@keyframes fwn4{0%,69%{fill:var(--panel)}70%,92%{fill:currentColor}100%{fill:var(--panel)}}
.fw-run{fill:var(--text);opacity:0;offset-path:path("M12 34H88");offset-rotate:0deg;animation:fwrun 4s linear infinite}
.fw-mon{stroke:currentColor;animation:fwmon 6s ease-in-out infinite}
@keyframes fwmon{0%{stroke-dashoffset:200}60%,92%{stroke-dashoffset:0}100%{stroke-dashoffset:200}}
.fw-alarm{opacity:0;animation:fwalarm 6s steps(1,end) infinite}@keyframes fwalarm{0%,33%{opacity:0}34%,51%{opacity:1}52%,100%{opacity:0}}
.fw-ring{fill:none;stroke:#e5534b;stroke-width:1.4;transform-box:fill-box;transform-origin:center;animation:fwring .9s ease-out infinite}@keyframes fwring{from{transform:scale(1);opacity:1}to{transform:scale(2.4);opacity:0}}
.fw-resolved{animation:fwres 6s steps(1,end) infinite}@keyframes fwres{0%,51%{opacity:0}52%,92%{opacity:1}93%,100%{opacity:0}}
.fw-okt{fill:none;stroke:var(--panel);stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.fw-dbi{fill:none;stroke:currentColor;stroke-width:1.6}
.fw-qslow{fill:#e5534b;opacity:.85;transform-origin:28px 0;animation:fwqs 6s linear infinite}.fw-qfast{transform-origin:28px 0;animation:fwqf 6s ease-out infinite}
@keyframes fwqs{0%{transform:scaleX(0)}65%,92%{transform:scaleX(1)}100%{transform:scaleX(0)}}
@keyframes fwqf{0%{transform:scaleX(0)}25%,92%{transform:scaleX(1)}100%{transform:scaleX(0)}}
.fw-ptrack{fill:var(--line2)}.fw-pbar{transform-origin:12px 0;animation:fwpbar 4s linear infinite}
@keyframes fwpbar{0%{transform:scaleX(0)}70%,92%{transform:scaleX(1)}100%{transform:scaleX(0)}}
@keyframes fwrun{0%{offset-distance:0%;opacity:1}70%{offset-distance:100%;opacity:1}75%,100%{offset-distance:100%;opacity:0}}
.fw-ping{opacity:0;transform-box:fill-box;transform-origin:center;animation:fwping 4s ease-out infinite}
@keyframes fwping{0%,70%{transform:scale(1);opacity:0}72%{opacity:.8}92%{transform:scale(2.6);opacity:0}100%{opacity:0}}</style>
<circle cx="8" cy="16" r="4" fill="#3fb950"/>
<text x="20" y="20" font-size="12.5" fill="#c9d1d9">featured work · production case studies</text>
<text x="900" y="20" text-anchor="end" font-size="11" fill="#6e7681">details on janarthanan.pages.dev</text>
